services:
  studify:
    build:
      context: .
      dockerfile: Dockerfile
    image: studify:latest
    container_name: studify
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      # Opzionale: path CLI se montati dal host (vedi sotto)
      CLAUDE_CLI: ${CLAUDE_CLI:-claude}
      GROK_CLI: ${GROK_CLI:-grok}
    volumes:
      # SQLite + foto appunti dal host (piani già generati)
      - ./data:/app/data
      #
      # Alternativa: volume Docker anonimo (DB vuoto a ogni nuova macchina)
      # - studify-data:/app/data
      #
      # Opzionale Linux/Mac: CLI AI dal host (login già fatto)
      # - ${HOME}/.local/bin/claude:/usr/local/bin/claude:ro
      # - ${HOME}/.claude:/home/nextjs/.claude
      # - ${HOME}/.grok/bin/grok:/usr/local/bin/grok:ro
      # - ${HOME}/.grok:/home/nextjs/.grok
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

